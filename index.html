<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk - Toko Buku Tinta</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="halaman-login" data-page="login">
  <main class="kotak-login">
    <h1>Toko Buku Tinta</h1>
    <p>Masuk untuk memesan dan melacak buku Anda.</p>
    <form id="formLogin" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="ghaits@toko.com" autocomplete="username">
      <p class="error" id="errEmail"></p>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password">
      <p class="error" id="errPass"></p>
      <button class="btn" type="submit" style="width:100%">Login</button>
    </form>
    <div class="aksi">
      <button class="btn garis" type="button" data-open="modalLupa">Lupa Password</button>
      <button class="btn garis" type="button" data-open="modalDaftar">Daftar</button>
    </div>
    <p style="font-size:.82rem;color:#5b6b80">Akun contoh: ghaits@toko.com / ghaits2026</p>
  </main>

  <div class="modal" id="modalLupa" hidden role="dialog" aria-modal="true" aria-labelledby="jLupa">
    <form class="modal-isi" id="formLupa" novalidate>
      <h2 id="jLupa">Lupa Password</h2>
      <label for="emailLupa">Email terdaftar</label>
      <input type="email" id="emailLupa">
      <p class="error" id="errLupa"></p>
      <button class="btn" type="submit">Kirim tautan reset</button>
      <button class="btn garis" type="button" data-close>Batal</button>
    </form>
  </div>

  <div class="modal" id="modalDaftar" hidden role="dialog" aria-modal="true" aria-labelledby="jDaftar">
    <form class="modal-isi" id="formDaftar" novalidate>
      <h2 id="jDaftar">Daftar Akun</h2>
      <label for="namaDaftar">Nama lengkap</label><input id="namaDaftar">
      <label for="emailDaftar">Email</label><input type="email" id="emailDaftar">
      <label for="passDaftar">Password (min. 6 karakter)</label><input type="password" id="passDaftar">
      <label for="passUlang">Ulangi password</label><input type="password" id="passUlang">
      <p class="error" id="errDaftar"></p>
      <button class="btn" type="submit">Daftar</button>
      <button class="btn garis" type="button" data-close>Batal</button>
    </form>
  </div>
  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
