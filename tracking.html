<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracking Pengiriman - Toko Buku Tinta</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="tracking">
  <header class="situs">
    <div class="logo">Toko Buku <span>Tinta</span></div>
    <nav aria-label="Navigasi utama">
      <a href="dashboard.html">Dashboard</a>
      <a href="stok.html">Katalog</a>
      <a href="checkout.html">Pemesanan</a>
      <a href="tracking.html" class="aktif">Tracking</a>
    </nav>
    <button id="btnLogout" class="btn kuning kecil" type="button">Keluar</button>
  </header>
  <main>
    <h1>Informasi Pengiriman</h1>
    <section class="kartu" aria-labelledby="jCari">
      <h2 id="jCari">Cari pesanan</h2>
      <form id="formTracking" novalidate>
        <label for="noDO">Nomor Delivery Order</label>
        <input id="noDO" placeholder="Contoh: DO2026001">
        <p class="error" id="errDO"></p>
        <button class="btn" type="submit">Cari</button>
      </form>
    </section>
    <section class="kartu" id="hasil" hidden aria-live="polite" aria-labelledby="jHasil">
      <h2 id="jHasil">Detail pengiriman</h2>
      <dl>
        <dt>Nama pemesan</dt>
        <dd id="rNama"></dd>
        <dt>Status</dt>
        <dd id="rStatus"></dd>
        <dt>Ekspedisi</dt>
        <dd id="rEkspedisi"></dd>
        <dt>Tanggal kirim</dt>
        <dd id="rTanggal"></dd>
        <dt>Jenis paket</dt>
        <dd id="rPaket"></dd>
        <dt>Total pembayaran</dt>
        <dd id="rTotal"></dd>
      </dl>
      <div class="progres" role="progressbar" aria-label="Progres pengiriman">
        <div id="bar"></div>
      </div>
      <ul class="langkah" id="langkah"></ul>
    </section>
  </main>
  <footer>
    <p>Tugas UTS Pemrograman Web 1 - Toko Buku Tinta</p>
  </footer>
  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
